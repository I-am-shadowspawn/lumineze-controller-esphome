name: ESPHome

on:
  push:
  pull_request:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read
  checks: read

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      baseline: ${{ steps.scope.outputs.baseline }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        run: python scripts/ci_change_scope.py
  validate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: python -m pip install -r requirements-ci.txt
      - name: Validate light combinations
        run: |
          esphome -s enable_jungle_dawn false config ci/controller.yaml > /dev/null
          esphome config ci/controller.yaml > /dev/null
          esphome config ci/controller-development.yaml > /dev/null
          esphome config ci/topology-generic.yaml > /dev/null
          esphome config ci/topology-generic-development.yaml
          esphome -s enable_jungle_dawn false -s enable_prot5 true -s prot5_mac AA:BB:CC:DD:EE:02 config ci/controller.yaml > /dev/null
          esphome -s enable_prot5 true -s prot5_mac AA:BB:CC:DD:EE:02 config ci/controller.yaml > /dev/null
      - name: Check declared software regressions
        run: |
          python scripts/check_fast_gates.py
          python scripts/check_gate_faults.py
          python scripts/check_build_resilience.py
          python scripts/check_ci_change_scope.py
      - name: Validate static topology and failure cases
        run: |
          python scripts/check_topology_schema.py esphome
          python scripts/check_schedule_schema.py esphome
      - name: Validate operational topology matrix
        run: |
          python scripts/check_topology_matrix.py esphome
          python scripts/check_topology_matrix.py --schedule esphome
      - name: Check project metadata across six profiles
        run: python scripts/check_project_metadata.py
      - name: Check seasonal entity and settings compatibility
        run: python scripts/check_seasonal_inventory.py esphome
      - name: Check real and development input isolation
        run: python scripts/check_input_isolation.py esphome
      - name: Check production fixture conversion and routing helpers
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/test_fixture_logic.cpp -o /tmp/lumineze-fixture-logic-test
          /tmp/lumineze-fixture-logic-test
          python scripts/check_temporary_policy.py
          python scripts/check_schedule_cases.py
          python scripts/check_schedule_storage.py
          python scripts/check_schedule_editor.py
          python scripts/check_schedule_policy.py
      - name: Check LuminEZE protocol trace
        run: python scripts/check_protocol_trace.py
      - name: Compare seasonal targets with v1
        run: python scripts/check_seasonal_parity.py
      - name: Compare live seasonal profile inputs
        run: python scripts/check_seasonal_profile_parity.py
      - name: Check production safe-off scopes
        run: python scripts/check_safe_off_scopes.py
      - name: Check topology dispatcher timeout cleanup
        run: python scripts/check_topology_dispatcher_timeout.py
      - name: Compile firmware
        shell: bash
        run: |
          set -Eeuo pipefail

          for attempt in 1 2 3; do
            echo "::group::Firmware build attempt ${attempt}/3"
            if esphome -s enable_prot5 true -s prot5_mac AA:BB:CC:DD:EE:02 compile ci/controller.yaml && \
               esphome compile ci/controller-development.yaml && \
               esphome compile ci/topology-generic.yaml && \
               esphome compile ci/topology-generic-development.yaml && \
               python scripts/check_topology_matrix.py --compile esphome && \
               python scripts/check_topology_matrix.py --schedule --compile esphome; then
              echo "::endgroup::"
              break
            else
              status=$?
            fi
            echo "::endgroup::"

            if [[ "$attempt" -eq 3 ]]; then
              echo "Firmware compilation failed after ${attempt} attempts." >&2
              exit "$status"
            fi

            delay=$((attempt * 20))
            echo "Firmware compilation attempt ${attempt} failed; retrying in ${delay}s." >&2
            sleep "$delay"
          done

          python scripts/check_generated_input_isolation.py
          python scripts/check_diagnostic_profiles.py
          for profile in legacy-seasonal-production legacy-seasonal-development seasonal-production seasonal-development; do
            python scripts/check_project_metadata.py --profile "$profile" --compiled --require-clean
          done

  profiles:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Profile / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [seasonal-production, seasonal-development, schedule-production, schedule-development]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-ci.txt
      - name: Validate manifest
        run: python scripts/check_profile_manifest.py
      - name: Select profile build directory
        id: selected
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python -c 'import json, os; p=json.load(open("ci/profile-matrix.json"))["profiles"][os.environ["PROFILE"]]; print("directory="+p["build_directory"])' >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/esphome
            ~/.platformio
            ci/.esphome/build/${{ steps.selected.outputs.directory }}
          key: ${{ runner.os }}-esphome-${{ hashFiles('requirements-ci.txt') }}-${{ matrix.profile }}-${{ hashFiles('packages/**', 'components/**', 'ci/*.yaml', 'ci/profile-matrix.json') }}
          restore-keys: |
            ${{ runner.os }}-esphome-${{ hashFiles('requirements-ci.txt') }}-${{ matrix.profile }}-
      - name: Build selected profile with retained retries and budgets
        run: python scripts/build_profile.py "${{ matrix.profile }}"
      - name: Check compiled profile isolation
        run: |
          python scripts/check_profile_isolation.py "${{ matrix.profile }}"
          python scripts/check_build_gate_faults.py "${{ matrix.profile }}"
          python scripts/check_project_metadata.py --profile "${{ matrix.profile }}" --compiled --require-clean
      - name: Check retained artifact boundary
        id: artifact_boundary
        if: always()
        run: python scripts/check_ci_artifacts.py "${{ matrix.profile }}"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.artifact_boundary.outcome == 'success' }}
        with:
          name: profile-${{ matrix.profile }}-${{ github.sha }}
          path: ci/artifacts/${{ matrix.profile }}
          if-no-files-found: warn
          retention-days: 14

  remote-consumer:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-ci.txt
      - name: Rehearse immutable consumer
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ALL_PROFILES: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$ALL_PROFILES" = "true" ]; then
            python scripts/check_remote_consumer.py --ref "$CANDIDATE_SHA" --all --compile
          else
            python scripts/check_remote_consumer.py --ref "$CANDIDATE_SHA" --compile
          fi
  required:
    name: Required validation
    needs: [changes, validate, profiles, remote-consumer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report complete validation or documentation-only success
        env:
          CODE: ${{ needs.changes.outputs.code }}
          SCOPE: ${{ needs.changes.result }}
          VALIDATE: ${{ needs.validate.result }}
          PROFILES: ${{ needs.profiles.result }}
          REMOTE: ${{ needs.remote-consumer.result }}
        run: |
          test "$SCOPE" = "success"
          if [ "$CODE" = "true" ]; then
            test "$VALIDATE" = "success"
            test "$PROFILES" = "success"
            test "$REMOTE" = "success"
          else
            test "$CODE" = "false"
            echo "Documentation-only update; full firmware checks skipped."
          fi
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'false'
      - name: Require successful preceding-source validation for docs-only updates
        if: needs.changes.outputs.code == 'false'
        env:
          BASELINE_SHA: ${{ needs.changes.outputs.baseline }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_documentation_baseline.py
