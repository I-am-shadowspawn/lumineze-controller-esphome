name: Dashboard companion
on:
  push:
    paths:
      - dashboard-companion/**
      - dist/lumineze-dashboard.js
      - hacs.json
      - .github/workflows/dashboard.yml
  pull_request:
    paths:
      - dashboard-companion/**
      - dist/lumineze-dashboard.js
      - hacs.json
      - .github/workflows/dashboard.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag of the draft release to prepare
        required: true
        type: string
jobs:
  dashboard:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
        working-directory: dashboard-companion
      - run: npm run build
        working-directory: dashboard-companion
      - run: git diff --exit-code -- dist/lumineze-dashboard.js
      - uses: hacs/action@main
        with:
          category: plugin
          # Catalog presentation follows the later repository split/layout work.
          ignore: description images topics
          comment: false
  release-asset:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build
        working-directory: dashboard-companion
      - run: git diff --exit-code -- dist/lumineze-dashboard.js
      - name: Verify published asset
        run: bash dashboard-companion/scripts/release-asset.sh verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
  prepare-release-asset:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build
        working-directory: dashboard-companion
      - run: git diff --exit-code -- dist/lumineze-dashboard.js
      - name: Prepare draft asset
        run: bash dashboard-companion/scripts/release-asset.sh prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
