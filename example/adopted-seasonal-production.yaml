# Adopted seasonal production example. This wrapper is similar to
# seasonal-production.yaml but splits the base adoption package from the
# selected profile. Use this when you provisioned the board with the bootstrap
# firmware and then adopted it in ESPHome Device Builder.
substitutions:
  device_name: my-vivarium-adopted
  friendly_name: My Vivarium (Adopted)
  area_name: Vivarium
  # Use a SHA that includes the adopt/lumineze.yaml entry point (T18 or later).
  controller_ref: e3bdc2b81c325379be456c0d1ac2acc8d0e16e8a
  timezone: Europe/London
  uv_mac: !secret my_vivarium_prot5_mac
  visible_mac: !secret my_vivarium_jungle_dawn_mac

packages:
  lumineze.adopt:
    url: https://github.com/I-am-shadowspawn/lumineze-controller-esphome
    ref: ${controller_ref}
    files:
      - adopt/lumineze.yaml
  lumineze.profile:
    url: https://github.com/I-am-shadowspawn/lumineze-controller-esphome
    ref: ${controller_ref}
    files:
      - packages/seasonal-production.yaml
      - path: packages/topology/context-seasonal.yaml
        vars: {context_id: vivarium, context_name: Vivarium}
      - path: packages/topology/group.yaml
        vars: {group_id: visible, group_name: Vivarium Visible}
      - path: packages/topology/group.yaml
        vars: {group_id: uv, group_name: Vivarium UV}
      - path: packages/topology/fixture-luminize.yaml
        vars:
          fixture_id: prot5
          fixture_name: ProT5
          fixture_mac: ${uv_mac}
          fixture_default_maximum: 0
      - path: packages/topology/fixture-luminize.yaml
        vars:
          fixture_id: jungle_dawn
          fixture_name: JungleDawn
          fixture_mac: ${visible_mac}
          fixture_default_maximum: 100

external_components:
  - source:
      type: git
      url: https://github.com/I-am-shadowspawn/lumineze-controller-esphome
      ref: ${controller_ref}
    components: [lumineze_topology]

lumineze_topology:
  topology_version: 1
  engine_family: seasonal
  input_provider: real
  contexts: [{id: vivarium}]
  groups:
    - {id: visible, context: vivarium, output: visible}
    - {id: uv, context: vivarium, output: uv}
  fixtures:
    - {id: prot5, slot: 0, type: prot5, group: uv, mac: '${uv_mac}'}
    - {id: jungle_dawn, slot: 1, type: jungle_dawn, group: visible, mac: '${visible_mac}'}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
api:
  encryption:
    key: !secret my_vivarium_encryption_key
