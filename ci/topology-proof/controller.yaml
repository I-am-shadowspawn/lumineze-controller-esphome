substitutions:
  device_name: topology-proof
packages:
  first: !include
    file: instance.yaml
    vars:
      fixture_id: fixture_a
      fixture_name: Fixture A
      fixture_mac: AA:BB:CC:DD:EE:01
  second: !include
    file: instance.yaml
    vars:
      fixture_id: fixture_b
      fixture_name: Fixture B
      fixture_mac: AA:BB:CC:DD:EE:02
external_components:
  - source:
      type: local
      path: ../../components
    components: [lumineze_topology]
lumineze_topology:
  topology_version: 1
  engine_family: seasonal
  contexts:
    - id: shared
  groups:
    - id: visible_group
      context: shared
      output: visible
  fixtures:
    - id: fixture_a
      slot: 0
      type: jungle_dawn
      group: visible_group
      mac: AA:BB:CC:DD:EE:01
    - id: fixture_b
      slot: 3
      type: jungle_dawn
      group: visible_group
      mac: AA:BB:CC:DD:EE:02
esphome:
  name: ${device_name}
esp32:
  variant: esp32c3
  framework:
    type: esp-idf
logger:
esp32_ble:
  max_connections: 2
esp32_ble_tracker:
  scan_parameters:
    continuous: false
script:
  - id: dispatcher_tick
    then:
      - lambda: ESP_LOGI("topology-proof", "arbiter");
