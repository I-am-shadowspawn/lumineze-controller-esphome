          type: entities
          title: UV group
          show_header_toggle: false
          color: state
          entities:
            - entity: switch.${CONTROLLER}_uv_automatic_control
            - entity: switch.${CONTROLLER}_vivarium_uv_manual_override
            - entity: number.${CONTROLLER}_vivarium_uv_manual_of_fixture_maximum
            - entity: sensor.${CONTROLLER}_vivarium_uv_demand
            - entity: sensor.${CONTROLLER}_vivarium_uv_delivery
            - entity: button.${CONTROLLER}_vivarium_uv_request_off
      - type: custom:config-template-card
        entities: []
