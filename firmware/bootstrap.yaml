# Bootstrap firmware: minimal, lamp-transport-free image for first provisioning.
# After Wi-Fi is configured and the board is adopted in ESPHome Device Builder,
# install one of the four production/development profiles to supply fixture MACs
# and the chosen engine. This firmware cannot operate lamps.
substitutions:
  device_name: lumineze-bootstrap
  friendly_name: LuminEZE Bootstrap
  area_name: Vivarium
  timezone: Europe/London
  controller_profile: bootstrap
  controller_ref: unrecorded
  controller_source_expression: '"Bootstrap source: ${controller_ref}"'
  logger_level: INFO
  bootstrap_ap_password: lumineze-setup

packages:
  project: !include ../packages/core/project.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  area: ${area_name}
  min_version: 2026.11.0
  project:
    name: shadowspawn.lumineze
    version: 2.0.0-dev

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  level: ${logger_level}

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: ${friendly_name} Setup
    password: ${bootstrap_ap_password}

captive_portal:

improv_serial:

text_sensor:
  - platform: template
    id: bootstrap_status
    name: Bootstrap Status
    entity_category: diagnostic
    update_interval: 60s
    lambda: return {"Uncommissioned bootstrap; install a profile to operate lamps"};

switch:
  - platform: template
    id: topology_commissioned
    name: Controller Commissioned
    entity_category: config
    icon: mdi:shield-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: return false;
    turn_on_action:
      - lambda: id(bootstrap_status).publish_state("Commissioned switch has no effect in bootstrap; install a profile");
    turn_off_action:
      - lambda: id(bootstrap_status).publish_state("Uncommissioned bootstrap; install a profile to operate lamps");
