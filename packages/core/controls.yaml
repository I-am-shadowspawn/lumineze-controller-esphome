button:
  - platform: template
    name: "Queue JungleDawn Level"
    icon: mdi:playlist-plus
    on_press:
      - switch.turn_on: jungle_dawn_manual_override
      - script.execute:
          id: submit_control_target
          lamp: 0
          source: 1
          fraction: 0.0
          level: !lambda return static_cast<int>(id(jungle_dawn_manual_level).state);
  - platform: template
    name: "Queue ProT5 Level"
    icon: mdi:playlist-plus
    on_press:
      - switch.turn_on: prot5_manual_override
      - script.execute:
          id: submit_control_target
          lamp: 1
          source: 1
          fraction: 0.0
          level: !lambda return static_cast<int>(id(prot5_manual_level).state);
  - platform: template
    name: "Queue Safe Off for Both Lamps"
    icon: mdi:power-off
    entity_category: config
    on_press:
      - switch.turn_off: jungle_dawn_automatic_control
      - switch.turn_off: prot5_automatic_control
      - switch.turn_off: jungle_dawn_manual_override
      - switch.turn_off: prot5_manual_override
      - script.execute:
          id: submit_control_target
          lamp: 0
          source: 2
          fraction: 0.0
          level: 0
      - script.execute:
          id: submit_control_target
          lamp: 1
          source: 2
          fraction: 0.0
          level: 0
  - platform: template
    name: "Cancel Pending LumenIZE Commands"
    icon: mdi:playlist-remove
    entity_category: config
    on_press:
      - lambda: |-
          id(lamp_pending)[0] = false;
          id(lamp_pending)[1] = false;
          id(lamp_request_generation)[0]++;
          id(lamp_request_generation)[1]++;
          id(jungle_dawn_dispatch_status).publish_state("Pending command cancelled");
          id(prot5_dispatch_status).publish_state("Pending command cancelled");
