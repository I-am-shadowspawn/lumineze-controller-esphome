binary_sensor:
  - platform: template
    id: jungle_dawn_connected
    name: "JungleDawn BLE Connected"
    device_class: connectivity
    entity_category: diagnostic
  - platform: template
    id: prot5_connected
    name: "ProT5 BLE Connected"
    device_class: connectivity
    entity_category: diagnostic
  - platform: template
    name: "JungleDawn Command Pending"
    entity_category: diagnostic
    lambda: return id(lamp_pending)[0];
  - platform: template
    name: "ProT5 Command Pending"
    entity_category: diagnostic
    lambda: return id(lamp_pending)[1];
  - platform: template
    name: "JungleDawn Readback Fresh For Last Command"
    entity_category: diagnostic
    lambda: return id(lamp_readback_fresh)[0];
  - platform: template
    name: "ProT5 Readback Fresh For Last Command"
    entity_category: diagnostic
    lambda: return id(lamp_readback_fresh)[1];
  - platform: template
    name: "JungleDawn Readback Mismatch"
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      return id(lamp_readback_fresh)[0] &&
             id(lamp_last_reported)[0] != id(lamp_last_completed)[0];
  - platform: template
    name: "ProT5 Readback Mismatch"
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      return id(lamp_readback_fresh)[1] &&
             id(lamp_last_reported)[1] != id(lamp_last_completed)[1];





  - platform: template
    name: "LumenIZE Transaction Active"
    entity_category: diagnostic
    lambda: return id(transaction_active);
  - platform: template
    name: "Controller Time Valid"
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(controller_time).now().is_valid();
  - platform: template
    name: "Invalid Time Fail-Safe Active"
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      const uint32_t grace_ms = static_cast<uint32_t>(
          std::max(30.0f, id(invalid_time_grace_period).state) * 1000.0f);
      return id(invalid_time_failsafe_enabled).state &&
             !id(solar_test_mode).state &&
             !id(controller_time).now().is_valid() && millis() >= grace_ms;
  - platform: template
    name: "JungleDawn Communication Fault"
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      const int maximum = std::max(
          1, static_cast<int>(id(ble_max_attempts).state));
      return id(lamp_consecutive_failures)[0] > 0 &&
             id(lamp_attempts_for_request)[0] >= maximum &&
             !id(lamp_pending)[0] &&
             (!id(transaction_active) || id(active_lamp) != 0);
  - platform: template
    name: "ProT5 Communication Fault"
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      const int maximum = std::max(
          1, static_cast<int>(id(ble_max_attempts).state));
      return id(lamp_consecutive_failures)[1] > 0 &&
             id(lamp_attempts_for_request)[1] >= maximum &&
             !id(lamp_pending)[1] &&
             (!id(transaction_active) || id(active_lamp) != 1);
  - platform: template
    name: "Solar Calculation Valid"
    entity_category: diagnostic
    lambda: return id(solar_calculation_valid);
  - platform: template
    name: "JungleDawn Control Output Invalid"
    device_class: problem
    entity_category: diagnostic
    lambda: return id(control_invalid_output)[0];
  - platform: template
    name: "ProT5 Control Output Invalid"
    device_class: problem
    entity_category: diagnostic
    lambda: return id(control_invalid_output)[1];
  - platform: template
    name: "JungleDawn Brightness Limit Applied"
    entity_category: diagnostic
    lambda: return id(control_limit_applied)[0];
  - platform: template
    name: "ProT5 Brightness Limit Applied"
    entity_category: diagnostic
    lambda: return id(control_limit_applied)[1];
  - platform: template
    name: "Simulated Sun Above Horizon"
    device_class: light
    entity_category: diagnostic
    lambda: |-
      return id(solar_calculation_valid) &&
             id(solar_daylight_envelope) > 0.0f;
  - platform: template
    name: "ProT5 UVB Window Active"
    icon: mdi:weather-sunny-alert
    entity_category: diagnostic
    lambda: |-
      return id(solar_calculation_valid) &&
             id(prot5_window_envelope) > 0.0f;

sensor:
  - platform: template
    name: "JungleDawn Pending Target"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic
    lambda: return id(lamp_target)[0];
    update_interval: 1s
  - platform: template
    name: "ProT5 Pending Target"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic
    lambda: return id(lamp_target)[1];
    update_interval: 1s
  - platform: template
    name: "JungleDawn Last Completed Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic
    lambda: |-
      if (id(lamp_last_completed)[0] < 0) return NAN;
      return static_cast<float>(id(lamp_last_completed)[0]);
    update_interval: 5s
  - platform: template
    name: "ProT5 Last Completed Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic
    lambda: |-
      if (id(lamp_last_completed)[1] < 0) return NAN;
      return static_cast<float>(id(lamp_last_completed)[1]);
    update_interval: 5s
  - platform: ble_client
    type: characteristic
    id: jungle_dawn_status_notification
    ble_client_id: jungle_dawn_client
    service_uuid: "0000FFF0"
    characteristic_uuid: "0000FFF1"
    internal: true
    notify: true
    update_interval: never
    lambda: |-
      // Arcadia response: 16 bytes, 02 F0, brightness percent at offset 3.
      if (x.size() != 16 || x[0] != 0x02 || x[1] != 0xF0 || x[3] > 100)
        return NAN;
      return static_cast<float>(x[3]);
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) return;  // ESPHome emits NaN on disconnect.
            id(lamp_last_reported)[0] = static_cast<int>(x);
            if (id(transaction_active) && id(active_lamp) == 0)
              id(lamp_readback_received)[0] = true;
            auto now = id(controller_time).now();
            id(jungle_dawn_last_reported_time).publish_state(
                now.is_valid() ? now.strftime("%Y-%m-%d %H:%M:%S")
                               : std::string("Clock not synchronised"));
            ESP_LOGI("lumenize", "JungleDawn lamp reported %d%%",
                     id(lamp_last_reported)[0]);
  - platform: ble_client
    type: characteristic
    id: prot5_status_notification
    ble_client_id: prot5_client
    service_uuid: "0000FFF0"
    characteristic_uuid: "0000FFF1"
    internal: true
    notify: true
    update_interval: never
    lambda: |-
      if (x.size() != 16 || x[0] != 0x02 || x[1] != 0xF0 || x[3] > 100)
        return NAN;
      return static_cast<float>(x[3]);
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) return;
            id(lamp_last_reported)[1] = static_cast<int>(x);
            if (id(transaction_active) && id(active_lamp) == 1)
              id(lamp_readback_received)[1] = true;
            auto now = id(controller_time).now();
            id(prot5_last_reported_time).publish_state(
                now.is_valid() ? now.strftime("%Y-%m-%d %H:%M:%S")
                               : std::string("Clock not synchronised"));
            ESP_LOGI("lumenize", "ProT5 lamp reported %d%%",
                     id(lamp_last_reported)[1]);
  - platform: template
    name: "JungleDawn Lamp-Reported Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic
    lambda: |-
      if (id(lamp_last_reported)[0] < 0) return NAN;
      return static_cast<float>(id(lamp_last_reported)[0]);
    update_interval: 5s
  - platform: template
