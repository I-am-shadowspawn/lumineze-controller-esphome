    restore_value: true
    optimistic: true
    on_value:
      - lambda: id(topology_seasonal_settings)[lumineze_topology::context_index("${context_id}")].uv_winter = x / 100.0f;
      - script.execute: evaluate_topology
  - platform: template
    id: ${context_id}_uv_summer
    name: ${context_id.replace('_', ' ').title()} UV Summer Peak
    entity_category: config
    unit_of_measurement: '% of maximum'
    min_value: 0
    max_value: 100
