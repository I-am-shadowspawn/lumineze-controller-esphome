    on_value:
      - lambda: id(topology_seasonal_settings)[lumineze_topology::context_index("${context_id}")].uv_exponent = x;
      - script.execute: evaluate_topology

sensor:
  - platform: template
    id: ${context_id}_visible_demand
    name: ${context_name} Visible Demand
    entity_category: diagnostic
    unit_of_measurement: '% of fixture maximum'
    accuracy_decimals: 1
    lambda: |-
      const auto &context = id(topology_contexts)[
          lumineze_topology::context_index("${context_id}")];
      return context.valid ? 100.0f * context.desired[0] : NAN;
    update_interval: 10s
  - platform: template
    id: ${context_id}_uv_demand
    name: ${context_name} UV Demand
    entity_category: diagnostic
    unit_of_measurement: '% of fixture maximum'
    accuracy_decimals: 1
    lambda: |-
      const auto &context = id(topology_contexts)[
          lumineze_topology::context_index("${context_id}")];
      return context.valid ? 100.0f * context.desired[1] : NAN;
    update_interval: 10s

text_sensor:
  - platform: template
    id: ${context_id}_status
    name: ${context_name} Evaluation Status
    entity_category: diagnostic
    lambda: |-
      const auto &context = id(topology_contexts)[
          lumineze_topology::context_index("${context_id}")];
      if (!id(topology_snapshot_valid)) return {"Waiting for valid time"};
      return {context.valid ? "Valid seasonal calculation" :
                              "Invalid seasonal settings/output"};
    update_interval: 10s
