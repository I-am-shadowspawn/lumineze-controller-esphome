# Include once per enabled fixture. The validator matches fixture_id/client MAC
# to its descriptor; fixture_name is display text only.
ble_client:
  - id: ${fixture_id}_client
    mac_address: ${fixture_mac}
    auto_connect: false
    on_connect:
      then:
        - lambda: |-
            const int slot = lumineze_topology::fixture_slot("${fixture_id}");
            id(topology_fixtures)[slot].connected = true;
    on_disconnect:
      then:
        - lambda: |-
            const int slot = lumineze_topology::fixture_slot("${fixture_id}");
            id(topology_fixtures)[slot].connected = false;
            auto &dispatcher = id(topology_dispatch);
            if (dispatcher.active && dispatcher.active_slot == slot &&
                !dispatcher.write_completed) dispatcher.failed = true;

number:
  - platform: template
    id: ${fixture_id}_maximum
    name: ${fixture_name} Calibrated Maximum
    entity_category: config
    unit_of_measurement: '%'
    min_value: 0
    max_value: 100
    step: 1
    initial_value: ${fixture_default_maximum}
    # The on_value/on_boot pair stores under an assignment fingerprint.
    restore_value: false
    optimistic: true
    on_value:
      - lambda: |-
          const int slot = lumineze_topology::fixture_slot("${fixture_id}");
          auto &fixture = id(topology_fixtures)[slot];
          fixture.maximum = x;
          if (fixture.calibration_ready && std::isfinite(x) &&
              x >= 0.0f && x <= 100.0f) {
            auto preference = global_preferences->make_preference<float>(
                lumineze_topology::calibration_key(slot));
            preference.save(&x);
          }
      - script.execute: evaluate_topology
  - platform: template
    id: ${fixture_id}_minimum_change
    name: ${fixture_id.replace('_', ' ').title()} Minimum Automatic Change
    entity_category: config
    unit_of_measurement: '%'
    min_value: 1
    max_value: 10
    step: 1
    initial_value: 2
    restore_value: true
    optimistic: true
    on_value:
      - lambda: id(topology_fixtures)[lumineze_topology::fixture_slot("${fixture_id}")].minimum_change = static_cast<int>(x);
      - script.execute: evaluate_topology
  - platform: template
    id: ${fixture_id}_manual_level
    name: ${fixture_name} Manual Absolute Level
    entity_category: config
    unit_of_measurement: '%'
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    restore_value: false
    optimistic: true
    on_value:
      - lambda: id(topology_fixtures)[lumineze_topology::fixture_slot("${fixture_id}")].manual_level = static_cast<int>(x);
      - script.execute: evaluate_topology
  - platform: template
    id: ${fixture_id}_daily_maximum_value
    name: ${fixture_name} Today's Automatic Maximum
    entity_category: config
    unit_of_measurement: '%'
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 60
    restore_value: false
    optimistic: true
  - platform: template
    id: ${fixture_id}_fixed_level_value
    name: ${fixture_name} Fixed Level
    entity_category: config
    unit_of_measurement: '%'
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 35
    restore_value: false
    optimistic: true
  - platform: template
    id: ${fixture_id}_fixed_duration_hours
    name: ${fixture_name} Fixed Duration
    entity_category: config
    unit_of_measurement: h
    min_value: 0.25
    max_value: 24
    step: 0.25
    initial_value: 2
    restore_value: false
    optimistic: true

switch:
  - platform: template
    id: ${fixture_id}_manual
    name: ${fixture_name} Manual Override
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: id(topology_fixtures)[lumineze_topology::fixture_slot("${fixture_id}")].manual = true;
      - script.execute: evaluate_topology
    on_turn_off:
      - lambda: id(topology_fixtures)[lumineze_topology::fixture_slot("${fixture_id}")].manual = false;
      - script.execute: evaluate_topology

button:
  - platform: template
    id: ${fixture_id}_safe_off
    name: ${fixture_name} Request Off
    icon: mdi:power
    on_press:
      - lambda: |-
          const int slot = lumineze_topology::fixture_slot("${fixture_id}");
          auto &fixture = id(topology_fixtures)[slot];
          fixture.manual = true;
          fixture.manual_level = 0;
          id(${fixture_id}_manual).publish_state(true);
          id(${fixture_id}_manual_level).publish_state(0);
      - script.execute: evaluate_topology
  - platform: template
    id: ${fixture_id}_apply_daily_maximum
    name: ${fixture_name} Apply Today's Maximum
    on_press:
      - lambda: |-
          using namespace lumineze_topology;
          const int slot = fixture_slot("${fixture_id}");
          auto &fixture = id(topology_fixtures)[slot];
          const int group_index_value = group_for_slot(slot);
          const auto &group = id(topology_groups)[group_index_value];
          const auto &group_binding = groups[group_index_value];
          const auto &context = id(topology_contexts)[group_binding.context];
          const float staged = id(${fixture_id}_daily_maximum_value).state;
          if (!std::isfinite(staged) || staged < 0.0f || staged > 100.0f ||
              !id(topology_snapshot_valid) || id(topology_snapshot).simulated ||
              !context.valid || !fixture.calibration_ready ||
              !group.automatic || group.manual || fixture.manual ||
              !group.valid) {
            fixture.temporary_rejection = 1;
            return;
          }
          fixture.temporary_rejection = 0;
          if (!apply_daily_maximum(fixture, static_cast<int>(std::lround(staged)),
                  id(topology_snapshot).year, id(topology_snapshot).day_of_year))
            fixture.temporary_rejection = 1;
      - script.execute: evaluate_topology
  - platform: template
    id: ${fixture_id}_start_fixed_level
    name: ${fixture_name} Start Fixed Level
    on_press:
      - lambda: |-
          using namespace lumineze_topology;
          const int slot = fixture_slot("${fixture_id}");
          auto &fixture = id(topology_fixtures)[slot];
          const int group_index_value = group_for_slot(slot);
          const auto &group = id(topology_groups)[group_index_value];
          const auto &group_binding = groups[group_index_value];
          const auto &context = id(topology_contexts)[group_binding.context];
          const float staged_level = id(${fixture_id}_fixed_level_value).state;
          const float staged_hours = id(${fixture_id}_fixed_duration_hours).state;
          const bool valid_duration = std::isfinite(staged_hours) &&
              staged_hours >= 0.25f && staged_hours <= 24.0f;
          if (!std::isfinite(staged_level) || staged_level < 0.0f ||
              staged_level > 100.0f || !valid_duration ||
              !id(topology_snapshot_valid) || !context.valid ||
              !fixture.calibration_ready || !group.automatic || group.manual ||
              fixture.manual || !group.valid ||
              !automatic_output_allowed(context.simulated,
                                        context.simulated_output_enabled)) {
            fixture.temporary_rejection = 2;
            return;
          }
          fixture.temporary_rejection = 0;
          const auto duration = static_cast<uint32_t>(std::lround(
              staged_hours * 3600000.0f));
          if (!start_timed_fixed_level(fixture,
                  static_cast<int>(std::lround(staged_level)), duration, millis()))
            fixture.temporary_rejection = 2;
      - script.execute: evaluate_topology
  - platform: template
    id: ${fixture_id}_cancel_temporary
    name: ${fixture_name} Cancel Temporary Lighting
    on_press:
      - lambda: |-
          const int slot = lumineze_topology::fixture_slot("${fixture_id}");
          auto &fixture = id(topology_fixtures)[slot];
          const bool was_active = fixture.temporary_mode !=
              lumineze_topology::TEMPORARY_NONE;
          if (fixture.pending && fixture.source ==
              lumineze_topology::TEMPORARY_FIXED)
            lumineze_topology::revoke_pending(fixture);
          lumineze_topology::cancel_temporary(fixture);
          if (was_active) fixture.temporary_status =
              lumineze_topology::TEMP_STATUS_RETURNING;
          fixture.temporary_force_reevaluation = true;
          fixture.temporary_rejection = 0;
      - script.execute: evaluate_topology

binary_sensor:
  - platform: template
    id: ${fixture_id}_connected
    name: ${fixture_name} BLE Connected
    entity_category: diagnostic
    lambda: return id(topology_fixtures)[lumineze_topology::fixture_slot("${fixture_id}")].connected;
  - platform: template
    id: ${fixture_id}_pending
    name: ${fixture_name} Request Pending
    entity_category: diagnostic
    lambda: return id(topology_fixtures)[lumineze_topology::fixture_slot("${fixture_id}")].pending;
  - platform: template
    id: ${fixture_id}_readback_fresh
    name: ${fixture_name} Readback Fresh
    entity_category: diagnostic
    lambda: return id(topology_fixtures)[lumineze_topology::fixture_slot("${fixture_id}")].readback_fresh;
  - platform: template
    id: ${fixture_id}_readback_mismatch
    name: ${fixture_name} Readback Mismatch
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      const auto &fixture = id(topology_fixtures)[
          lumineze_topology::fixture_slot("${fixture_id}")];
      return fixture.readback_fresh && fixture.reported != fixture.completed;
  - platform: template
    id: ${fixture_id}_daily_maximum_active
    name: ${fixture_name} Temporary Maximum Active
    lambda: return id(topology_fixtures)[lumineze_topology::fixture_slot("${fixture_id}")].temporary_mode == lumineze_topology::DAILY_MAXIMUM;
  - platform: template
    id: ${fixture_id}_fixed_level_active
    name: ${fixture_name} Fixed Level Active
    lambda: return id(topology_fixtures)[lumineze_topology::fixture_slot("${fixture_id}")].temporary_mode == lumineze_topology::TIMED_FIXED_LEVEL;

sensor:
  - platform: ble_client
    type: characteristic
    id: ${fixture_id}_status_notification
    ble_client_id: ${fixture_id}_client
    service_uuid: '0000FFF0'
    characteristic_uuid: '0000FFF1'
    internal: true
    notify: true
    update_interval: never
    lambda: |-
      if (x.size() != 16 || x[0] != 0x02 || x[1] != 0xF0 || x[3] > 100)
        return NAN;
      return static_cast<float>(x[3]);
    on_value:
      then:
        - lambda: |-
            if (!std::isfinite(x)) return;
            const int slot = lumineze_topology::fixture_slot("${fixture_id}");
            auto &fixture = id(topology_fixtures)[slot];
            fixture.reported = static_cast<int>(x);
            if (id(topology_dispatch).active &&
                id(topology_dispatch).active_slot == slot &&
                id(topology_dispatch).write_completed)
              fixture.readback_received = true;
  - platform: template
    id: ${fixture_id}_reported_level
    name: ${fixture_name} Lamp Reported Level
    entity_category: diagnostic
    unit_of_measurement: '%'
    accuracy_decimals: 0
    lambda: |-
      const int value = id(topology_fixtures)[lumineze_topology::fixture_slot("${fixture_id}")].reported;
      if (value < 0) return NAN;
      return static_cast<float>(value);
    update_interval: 5s
  - platform: template
    id: ${fixture_id}_completed_level
    name: ${fixture_name} Last Completed Level
    entity_category: diagnostic
    unit_of_measurement: '%'
    accuracy_decimals: 0
    lambda: |-
      const int value = id(topology_fixtures)[lumineze_topology::fixture_slot("${fixture_id}")].completed;
      if (value < 0) return NAN;
      return static_cast<float>(value);
    update_interval: 5s
  - platform: template
    id: ${fixture_id}_completed_transactions
    name: ${fixture_name} Completed Transactions
    entity_category: diagnostic
    accuracy_decimals: 0
    lambda: return static_cast<float>(id(topology_fixtures)[lumineze_topology::fixture_slot("${fixture_id}")].completed_count);
    update_interval: 5s
  - platform: template
    id: ${fixture_id}_failed_transactions
    name: ${fixture_name} Failed Transactions
    entity_category: diagnostic
    accuracy_decimals: 0
    lambda: return static_cast<float>(id(topology_fixtures)[lumineze_topology::fixture_slot("${fixture_id}")].failure_count);
    update_interval: 5s
  - platform: template
    id: ${fixture_id}_requested_level
    name: ${fixture_name} Requested Level
    entity_category: diagnostic
    unit_of_measurement: '%'
    accuracy_decimals: 0
    lambda: return static_cast<float>(id(topology_fixtures)[lumineze_topology::fixture_slot("${fixture_id}")].target);
    update_interval: 5s
  - platform: template
    id: ${fixture_id}_temporary_time_remaining
    name: ${fixture_name} Temporary Time Remaining
    entity_category: diagnostic
    unit_of_measurement: min
    accuracy_decimals: 0
    lambda: |-
      const auto &fixture = id(topology_fixtures)[
          lumineze_topology::fixture_slot("${fixture_id}")];
      if (fixture.temporary_mode != lumineze_topology::TIMED_FIXED_LEVEL)
        return 0.0f;
      const uint32_t elapsed_ms = millis() - fixture.temporary_started_ms;
      if (elapsed_ms >= fixture.temporary_duration_ms) return 0.0f;
      return static_cast<float>(fixture.temporary_duration_ms - elapsed_ms) / 60000.0f;
    update_interval: 10s

text_sensor:
  - platform: template
    id: ${fixture_id}_dispatch_status
    name: ${fixture_name} Dispatch Status
    entity_category: diagnostic
  - platform: template
    id: ${fixture_id}_readback_status
    name: ${fixture_name} Readback Status
    entity_category: diagnostic
  - platform: template
    id: ${fixture_id}_temporary_status
    name: ${fixture_name} Temporary Lighting Status
    lambda: |-
      const auto &fixture = id(topology_fixtures)[
          lumineze_topology::fixture_slot("${fixture_id}")];
      if (fixture.temporary_rejection == 1)
        return {"Rejected: daily maximum needs live date, calibration and automatic control"};
      if (fixture.temporary_rejection == 2)
        return {"Rejected: fixed level needs valid duration, calibration and automatic control"};
      switch (fixture.temporary_status) {
        case lumineze_topology::TEMP_STATUS_ARMED: return {"Armed"};
        case lumineze_topology::TEMP_STATUS_HOLDING: return {"Holding at temporary maximum"};
        case lumineze_topology::TEMP_STATUS_ENFORCING: return {"Enforcing temporary maximum; awaiting confirmation"};
        case lumineze_topology::TEMP_STATUS_FIXED: return {"Fixed level active"};
        case lumineze_topology::TEMP_STATUS_RETURNING: return {"Returning to current automatic curve"};
        default: return {"Inactive"};
      }
    update_interval: 5s

script:
  - id: ${fixture_id}_transaction
    mode: single
    parameters:
      token: uint32_t
    then:
      - lambda: |-
          id(${fixture_id}_dispatch_status).publish_state("Connecting");
          id(${fixture_id}_readback_status).publish_state("Awaiting lamp status");
      - ble_client.connect: ${fixture_id}_client
      - delay: 1s
      - ble_client.ble_write:
          id: ${fixture_id}_client
          service_uuid: '0000FFF0'
          characteristic_uuid: '0000FFF2'
          value: [0x05, 0xF0, 0x00, 0x01, 0x02, 0x03, 0x04, 0x00,
                  0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x50]
      - delay: 200ms
      - ble_client.ble_write:
          id: ${fixture_id}_client
          service_uuid: '0000FFF0'
          characteristic_uuid: '0000FFF2'
          value: !lambda |-
            const int slot = lumineze_topology::fixture_slot("${fixture_id}");
            return {0x02, 0xF1, 0x00,
                    static_cast<uint8_t>(id(topology_fixtures)[slot].in_flight),
                    0x02, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                    0x00, 0x00, 0x00, 0x20};
      - delay: 300ms
      - if:
          condition:
            lambda: |-
              return id(topology_fixtures)[lumineze_topology::fixture_slot("${fixture_id}")].connected &&
                     !id(topology_dispatch).failed;
          then:
            - lambda: id(topology_dispatch).write_completed = true;
            - lambda: id(topology_fixtures)[lumineze_topology::fixture_slot("${fixture_id}")].readback_received = false;
            - ble_client.ble_write:
                id: ${fixture_id}_client
                service_uuid: '0000FFF0'
                characteristic_uuid: '0000FFF2'
                value: [0x02, 0x0F, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                        0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x20]
            - wait_until:
                condition:
                  lambda: |-
                    const int slot = lumineze_topology::fixture_slot("${fixture_id}");
                    return id(topology_fixtures)[slot].readback_received ||
                           !id(topology_fixtures)[slot].connected;
                timeout: 1500ms
            - ble_client.disconnect: ${fixture_id}_client
            - wait_until:
                condition:
                  lambda: |-
                    return !id(topology_fixtures)[
                        lumineze_topology::fixture_slot("${fixture_id}")].connected;
                timeout: 5s
            - lambda: |-
                const int slot = lumineze_topology::fixture_slot("${fixture_id}");
                auto &dispatcher = id(topology_dispatch);
                if (!lumineze_topology::owns_transaction(dispatcher, slot, token)) return;
                auto &fixture = id(topology_fixtures)[slot];
                if (fixture.connected) {
                  id(record_topology_failure)->execute(slot, token);
                  return;
                }
                if (!lumineze_topology::complete_transaction(
                        fixture, dispatcher, slot, token)) return;
                if (fixture.readback_fresh) {
                  id(${fixture_id}_readback_status).publish_state(
                      fixture.reported == fixture.completed ? "Confirmed" : "Mismatch");
                } else {
                  id(${fixture_id}_readback_status).publish_state(
                      "No status response; last report may be stale");
                }
                id(${fixture_id}_dispatch_status).publish_state("Write completed");
          else:
            - script.execute:
                id: record_topology_failure
                slot: !lambda return lumineze_topology::fixture_slot("${fixture_id}");
                token: !lambda return id(topology_dispatch).token;

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            const int slot = lumineze_topology::fixture_slot("${fixture_id}");
            auto &fixture = id(topology_fixtures)[slot];
            auto preference = global_preferences->make_preference<float>(
                lumineze_topology::calibration_key(slot));
            float restored = 0.0f;
            if (preference.load(&restored) && std::isfinite(restored) &&
                restored >= 0.0f && restored <= 100.0f) {
              fixture.maximum = restored;
              id(${fixture_id}_maximum).publish_state(restored);
            }
            fixture.calibration_ready = true;
        - script.execute: evaluate_topology
