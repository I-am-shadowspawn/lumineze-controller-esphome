# Seasonal development profile uses the same engine with explicit dev inputs.
substitutions:
  controller_profile: seasonal-development
  topology_engine_evaluator: evaluate_seasonal_contexts
  topology_snapshot_provider: capture_topology_development_snapshot
  logger_level: DEBUG
packages:
  seasonal_engine: !include topology/seasonal-engine.yaml
  controller: !include topology/controller-core.yaml
  input_provider: !include topology/input-development.yaml
