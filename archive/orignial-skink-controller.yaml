# Board: Generic ESP32-C3 Board (Generic)
# Definition: definitions/boards/generic-esp32c3/manifest.yaml

esphome:
  name: lumineze-controler-skink
  friendly_name: LuminEZE Controler Skink
  area: Skink House

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  level: DEBUG
time:
  - platform: sntp
    id: controller_time
    timezone: Europe/London
    on_time_sync:
      - text_sensor.template.publish:
          id: controller_last_time_source
          state: "SNTP"
  - platform: homeassistant
    id: homeassistant_time
    timezone: Europe/London
    on_time_sync:
      - text_sensor.template.publish:
          id: controller_last_time_source
          state: "Home Assistant"
api:
  encryption:
    key: !secret lumineze_controler_skink__encryption_key
  reboot_timeout: 0s
esp32_ble:
  max_connections: 2
  connection_timeout: 20s
  
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: LuminEZE Contro Fallback Hotspot
    password: !secret lumineze_controler_skink__ap_password
    
captive_portal:

# Non-continuous scanning is preferable on the single-core ESP32-C3.
# The BLE clients have fixed MAC addresses and connect only on command.
esp32_ble_tracker:
  scan_parameters:
    continuous: false
  software_coexistence: true


