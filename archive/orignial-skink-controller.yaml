ble_client:
  - id: jungle_dawn_client
    mac_address: !secret lumineze_controler_skink__vivarium_jungle_dawn_mac
    auto_connect: false
    on_connect:
      then:
        - lambda: id(lamp_connected)[0] = true;
        - binary_sensor.template.publish:
            id: jungle_dawn_connected
            state: ON
        - logger.log:
            level: INFO
            tag: lumenize
            format: "JungleDawn BLE connected"
    on_disconnect:
      then:
        - lambda: id(lamp_connected)[0] = false;
        - binary_sensor.template.publish:
            id: jungle_dawn_connected
            state: OFF
        - logger.log:
            level: INFO
            tag: lumenize
            format: "JungleDawn BLE disconnected"
        - if:
            condition:
              lambda: |-
                return id(transaction_active) &&
                       id(active_lamp) == 0 &&
                       !id(transaction_write_completed);
            then:
              - script.execute:
                  id: record_ble_failure
                  lamp: 0

  - id: prot5_client
    mac_address: !secret lumineze_controler_skink__vivarium_prot5_mac
    auto_connect: false
    on_connect:
      then:
        - lambda: id(lamp_connected)[1] = true;
        - binary_sensor.template.publish:
            id: prot5_connected
            state: ON
        - logger.log:
            level: INFO
            tag: lumenize
            format: "ProT5 BLE connected"
    on_disconnect:
      then:
        - lambda: id(lamp_connected)[1] = false;
        - binary_sensor.template.publish:
            id: prot5_connected
            state: OFF
        - logger.log:
            level: INFO
            tag: lumenize
            format: "ProT5 BLE disconnected"
        - if:
            condition:
              lambda: |-
                return id(transaction_active) &&
                       id(active_lamp) == 1 &&
                       !id(transaction_write_completed);
            then:
              - script.execute:
                  id: record_ble_failure
                  lamp: 1

binary_sensor:
  - platform: template
    id: jungle_dawn_connected
    name: "JungleDawn BLE Connected"
    device_class: connectivity
    entity_category: diagnostic
  - platform: template
    id: prot5_connected
    name: "ProT5 BLE Connected"
    device_class: connectivity
    entity_category: diagnostic
  - platform: template
    name: "JungleDawn Command Pending"
    entity_category: diagnostic
    lambda: return id(lamp_pending)[0];
  - platform: template
    name: "ProT5 Command Pending"
    entity_category: diagnostic
    lambda: return id(lamp_pending)[1];
  - platform: template
    name: "JungleDawn Readback Fresh For Last Command"
    entity_category: diagnostic
    lambda: return id(lamp_readback_fresh)[0];
  - platform: template
    name: "ProT5 Readback Fresh For Last Command"
    entity_category: diagnostic
    lambda: return id(lamp_readback_fresh)[1];
  - platform: template
    name: "JungleDawn Readback Mismatch"
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      return id(lamp_readback_fresh)[0] &&
             id(lamp_last_reported)[0] != id(lamp_last_completed)[0];
  - platform: template
    name: "ProT5 Readback Mismatch"
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      return id(lamp_readback_fresh)[1] &&
             id(lamp_last_reported)[1] != id(lamp_last_completed)[1];




    
  - platform: template
    name: "LumenIZE Transaction Active"
    entity_category: diagnostic
    lambda: return id(transaction_active);
  - platform: template
    name: "Controller Time Valid"
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(controller_time).now().is_valid();
  - platform: template
    name: "Invalid Time Fail-Safe Active"
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      const uint32_t grace_ms = static_cast<uint32_t>(
          std::max(30.0f, id(invalid_time_grace_period).state) * 1000.0f);
      return id(invalid_time_failsafe_enabled).state &&
             !id(solar_test_mode).state &&
             !id(controller_time).now().is_valid() && millis() >= grace_ms;
  - platform: template
    name: "JungleDawn Communication Fault"
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      const int maximum = std::max(
          1, static_cast<int>(id(ble_max_attempts).state));
      return id(lamp_consecutive_failures)[0] > 0 &&
             id(lamp_attempts_for_request)[0] >= maximum &&
             !id(lamp_pending)[0] &&
             (!id(transaction_active) || id(active_lamp) != 0);
  - platform: template
    name: "ProT5 Communication Fault"
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      const int maximum = std::max(
          1, static_cast<int>(id(ble_max_attempts).state));
      return id(lamp_consecutive_failures)[1] > 0 &&
             id(lamp_attempts_for_request)[1] >= maximum &&
             !id(lamp_pending)[1] &&
             (!id(transaction_active) || id(active_lamp) != 1);
  - platform: template
    name: "Solar Calculation Valid"
    entity_category: diagnostic
    lambda: return id(solar_calculation_valid);
  - platform: template
    name: "Simulated Sun Above Horizon"
    device_class: light
    entity_category: diagnostic
    lambda: |-
      return id(solar_calculation_valid) &&
             id(solar_daylight_envelope) > 0.0f;
  - platform: template
    name: "ProT5 UVB Window Active"
    icon: mdi:weather-sunny-alert
    entity_category: diagnostic
    lambda: |-
      return id(solar_calculation_valid) &&
             id(prot5_window_envelope) > 0.0f;

switch:
  - platform: template
    id: solar_test_mode
    name: "Solar Test Mode"
    icon: mdi:test-tube
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: |-
          id(jungle_dawn_curve_should_queue) = false;
          id(prot5_curve_should_queue) = false;
          if (id(jungle_dawn_automatic_control).state &&
              !id(jungle_dawn_manual_override).state &&
              (!id(transaction_active) || id(active_lamp) != 0)) {
            id(lamp_pending)[0] = false;
          }
          if (id(prot5_automatic_control).state &&
              !id(prot5_manual_override).state &&
              (!id(transaction_active) || id(active_lamp) != 1)) {
            id(lamp_pending)[1] = false;
          }
      - script.execute: calculate_solar
    on_turn_off:
      - script.execute: calculate_solar
  - platform: template
    id: invalid_time_failsafe_enabled
    name: "Invalid Time Fail-Safe"
    icon: mdi:shield-clock
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: calculate_solar
    on_turn_off:
      - lambda: |-
          id(invalid_time_failsafe_sent)[0] = false;
          id(invalid_time_failsafe_sent)[1] = false;
      - script.execute: calculate_solar
  - platform: template
    id: jungle_dawn_automatic_control
    name: "JungleDawn Automatic Control"
    icon: mdi:brightness-auto
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          id(jungle_dawn_curve_has_queued) = false;
          id(jungle_dawn_curve_should_queue) = false;
          id(jungle_dawn_curve_status).publish_state(
              "Automatic control enabled; awaiting solar calculation");
      - script.execute: calculate_solar
    on_turn_off:
      - lambda: |-
          id(jungle_dawn_curve_should_queue) = false;
          if (!id(jungle_dawn_manual_override).state &&
              (!id(transaction_active) || id(active_lamp) != 0)) {
            id(lamp_pending)[0] = false;
          }
          id(jungle_dawn_curve_status).publish_state(
              "Automatic control disabled; lamp state held");
  - platform: template
    id: prot5_automatic_control
    name: "ProT5 Automatic Control"
    icon: mdi:brightness-auto
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          id(prot5_curve_has_queued) = false;
          id(prot5_curve_should_queue) = false;
          id(prot5_curve_status).publish_state(
              "Automatic control enabled; awaiting solar calculation");
      - script.execute: calculate_solar
    on_turn_off:
      - lambda: |-
          id(prot5_curve_should_queue) = false;
          if (!id(prot5_manual_override).state &&
              (!id(transaction_active) || id(active_lamp) != 1)) {
            id(lamp_pending)[1] = false;
          }
          id(prot5_curve_status).publish_state(
              "Automatic control disabled; lamp state held");
  - platform: template
    id: jungle_dawn_manual_override
    name: "JungleDawn Manual Override"
    icon: mdi:hand-back-right
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: |-
          id(jungle_dawn_curve_should_queue) = false;
          if (!id(transaction_active) || id(active_lamp) != 0) {
            id(lamp_pending)[0] = false;
          }
          id(jungle_dawn_curve_status).publish_state(
              "Manual override active; use Queue JungleDawn Level");
    on_turn_off:
      - lambda: |-
          id(jungle_dawn_curve_has_queued) = false;
          id(jungle_dawn_curve_should_queue) = false;
          id(jungle_dawn_curve_status).publish_state(
              "Manual override released; awaiting solar calculation");
      - script.execute: calculate_solar
  - platform: template
    id: prot5_manual_override
    name: "ProT5 Manual Override"
    icon: mdi:hand-back-right
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: |-
          id(prot5_curve_should_queue) = false;
          if (!id(transaction_active) || id(active_lamp) != 1) {
            id(lamp_pending)[1] = false;
          }
          id(prot5_curve_status).publish_state(
              "Manual override active; use Queue ProT5 Level");
    on_turn_off:
      - lambda: |-
          id(prot5_curve_has_queued) = false;
          id(prot5_curve_should_queue) = false;
          id(prot5_curve_status).publish_state(
              "Manual override released; awaiting solar calculation");
      - script.execute: calculate_solar

